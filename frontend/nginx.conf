server {
    listen 80;

    # บีบอัดก่อนส่ง ไฟล์ JS ของแอปใหญ่ราว 2.8 MB แต่บีบแล้วเหลือไม่ถึง 800 KB
    # อินเทอร์เน็ตของโรงเรียนช้าและมีนักเรียนเปิดพร้อมกันทั้งห้อง การไม่บีบอัดจึงเท่ากับ
    # ทิ้งแบนด์วิดท์ไปเปล่า ๆ เกือบสามในสี่
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For SPA routing
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์ใน assets/ มีลายเซ็นของเนื้อหาอยู่ในชื่อไฟล์ เปลี่ยนเนื้อหาเมื่อไรชื่อก็เปลี่ยน
    # จึงให้เบราว์เซอร์เก็บไว้ยาว ๆ ได้ เครื่องที่เคยเปิดแล้วจะไม่ต้องโหลดซ้ำทุกคาบ
    location /assets/ {
        root   /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO connections to the backend container
    location /socket.io/ {
        proxy_pass http://backend:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
