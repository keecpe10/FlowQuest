# ส่งหัว Connection: upgrade เฉพาะตอนที่ผู้เรียกขออัปเกรดมาจริงเท่านั้น
# ถ้ายัดใส่ทุกคำขอ คำขอ API ธรรมดาจะถูกมองว่าเป็นการเริ่ม WebSocket แล้ว worker ฝั่ง
# gunicorn/gevent จะค้างรอ handshake ที่ไม่มีวันมา จนหมดเวลาเป็น 504
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # บีบอัดก่อนส่ง ไฟล์ JS ของแอปใหญ่ราว 2.8 MB แต่บีบแล้วเหลือไม่ถึง 800 KB
    # อินเทอร์เน็ตของโรงเรียนช้าและมีนักเรียนเปิดพร้อมกันทั้งห้อง การไม่บีบอัดจึงเท่ากับ
    # ทิ้งแบนด์วิดท์ไปเปล่า ๆ เกือบสามในสี่
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For SPA routing
        try_files $uri $uri/ /index.html;

        # index.html ต้องถามเซิร์ฟเวอร์ทุกครั้งว่ามีของใหม่ไหม เพราะมันเป็นตัวชี้ว่าจะ
        # โหลดไฟล์ก้อนไหน ถ้าปล่อยให้เบราว์เซอร์แคช ผู้ใช้จะค้างอยู่กับ build เก่าไป
        # เรื่อย ๆ ทั้งที่ deploy ของใหม่ไปแล้ว (ไฟล์ใน assets/ แคชยาวได้เพราะชื่อไฟล์
        # เปลี่ยนตามเนื้อหาอยู่แล้ว)
        add_header Cache-Control "no-cache";
    }

    # ไฟล์ใน assets/ มีลายเซ็นของเนื้อหาอยู่ในชื่อไฟล์ เปลี่ยนเนื้อหาเมื่อไรชื่อก็เปลี่ยน
    # จึงให้เบราว์เซอร์เก็บไว้ยาว ๆ ได้ เครื่องที่เคยเปิดแล้วจะไม่ต้องโหลดซ้ำทุกคาบ
    location /assets/ {
        root   /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # XLSX imports allow the documented file size and time to hash new passwords.
    location /api/v1/students/import {
        client_max_body_size 6m;
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO connections to the backend container
    location /socket.io/ {
        proxy_pass http://backend:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket ที่เปิดค้างไว้ต้องไม่ถูกตัดระหว่างที่ยังไม่มีข้อความวิ่ง
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
